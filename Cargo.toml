[package]
name = "kdenlive-mcp-plus"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.6.0", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "io-std", "process"] }

[build-dependencies]
bindgen = "0.73.2"
pkg-config = "0.3.34"

[dev-dependencies]
rmcp = { version = "3.6.0", default-features = false, features = ["macros", "server", "transport-io", "client", "transport-child-process"] }
